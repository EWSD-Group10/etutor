version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: etutor_postgres
    environment:
      POSTGRES_USER: etutor_user
      POSTGRES_PASSWORD: etutor_password
      POSTGRES_DB: etutor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etutor_user -d etutor_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: etutor_backend
    environment:
      DATABASE_URL: postgresql://etutor_user:etutor_password@postgres:5432/etutor_db
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
