version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: etutor_postgres
    environment:
      POSTGRES_USER: etutor_user
      POSTGRES_PASSWORD: etutor_password
      POSTGRES_DB: etutor_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etutor_user -d etutor_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # seeder:
  #   build: ./backend
  #   container_name: etutor_seeder
  #   environment:
  #     DB_USER: etutor_user
  #     DB_PASSWORD: etutor_password
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_NAME: etutor_db
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - ./backend:/app
  #     - backend_node_modules:/app/node_modules
  #     - ./data:/app/data
  #   command: node scripts/seed-users.js ./data/users.csv
  #   restart: no

  backend:
    build: ./backend
    container_name: etutor_backend
    environment:
      DATABASE_URL: postgresql://etutor_user:etutor_password@postgres:5432/etutor_db
      PORT: 8080
      NODE_ENV: development
      JWT_SECRET: change-this-secret-in-production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npx prisma generate && npm run dev"

  # frontend:
  #   build: ./frontend
  #   container_name: etutor_frontend
  #   environment:
  #     NODE_ENV: development
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./frontend:/app
  #     - frontend_node_modules:/app/node_modules
  #   command: npm run dev

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
