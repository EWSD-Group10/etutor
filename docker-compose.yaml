version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: etutor_postgres
    environment:
      POSTGRES_USER: etutor_user
      POSTGRES_PASSWORD: etutor_password
      POSTGRES_DB: etutor_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etutor_user -d etutor_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # seeder:
  #   build: ./backend
  #   container_name: etutor_seeder
  #   environment:
  #     DATABASE_URL: postgresql://etutor_user:etutor_password@postgres:5432/etutor_db
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - ./backend:/app
  #     - backend_node_modules:/app/node_modules
  #     - ./data:/app/data
  #   command: sh -c "npm install --legacy-peer-deps && node scripts/seed.js"
  #   restart: no

  backend:
    build: ./backend
    container_name: etutor_backend
    environment:
      DATABASE_URL: postgresql://etutor_user:etutor_password@postgres:5432/etutor_db
      PORT: 8080
      NODE_ENV: development
      JWT_SECRET: change-this-secret-in-production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run dev"

  # frontend:
  #   build: ./frontend
  #   container_name: etutor_frontend
  #   platform: linux/amd64
  #   environment:
  #     NODE_ENV: development
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./frontend/src:/app/src
  #     - ./frontend/public:/app/public
  #   command: npm run dev

volumes:
  postgres_data:
  backend_node_modules:
